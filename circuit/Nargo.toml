[package]
name = "mf_signatures"
type = "bin"
authors = [""]
compiler_version = ">=1.0.0"

# noir-ed25519 is a submodule pinned to a commit (it has no release tag for its current code).
# bignum, edwards_bignum and sha512 must be the same versions noir-ed25519 depends on.
[dependencies]
ed25519 = { path = "lib/noir-ed25519" }
bignum = { git = "https://github.com/noir-lang/noir-bignum", tag = "v0.10.0" }
edwards_bignum = { git = "https://github.com/willemolding/noir-edwards-bignum", tag = "v0.1.0-alpha.4" }
sha512 = { git = "https://github.com/zkpassport/sha512", tag = "v0.2.0" }
sha256 = { git = "https://github.com/noir-lang/sha256", tag = "v0.3.0" }
