<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:">
<title>Monad Foundation announcements</title>
<style>
  :root { --purple: #6e54ff; --deep: #200052; --ink: #0f0f12; --muted: #727285; --line: #ececec; --tint: #f1efff; }
  body { font: 15px/1.6 Inter, system-ui, sans-serif; margin: 0; background: #fbfaf9; color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 0 1rem 3rem; }
  .hero { background: radial-gradient(120% 140% at 0% 0%, var(--purple), var(--deep) 60%); color: #fbfaf9; padding: 2.5rem 1rem 2rem; margin-bottom: 1.5rem; }
  .hero > div { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.7rem; letter-spacing: -.02em; margin: 0 0 .3rem; }
  .hero p { margin: 0; opacity: .8; }
  .tag { font: 600 11px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; background: #fbfaf9; color: var(--deep); border-radius: 99px; padding: .2rem .6rem; vertical-align: middle; margin-left: .5rem; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: #b00020; }
  .warning { background: #fff4d6; border: 1px solid #f0d58a; border-radius: 12px; padding: .6rem .9rem; margin: 1rem 0; }
  article { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem 1.4rem; margin: 1rem 0; box-shadow: 0 1px 2px #20005210; }
  article header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  article h2 { font-size: 1.05rem; margin: 0; color: var(--deep); }
  .badge { font-size: 12px; font-weight: 600; color: var(--purple); background: var(--tint); border-radius: 99px; padding: .15rem .6rem; white-space: nowrap; }
  .body { white-space: pre-wrap; word-break: break-word; margin: .8rem 0 .4rem; }
  code { font: 13px ui-monospace, monospace; background: var(--tint); color: var(--deep); padding: .05em .3em; border-radius: 4px; }
  a { color: var(--purple); }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .fpr { font: 12px ui-monospace, monospace; color: var(--muted); }
  footer { margin-top: 3rem; }
  form { display: grid; grid-template-columns: auto 1fr; gap: .5rem .8rem; align-items: center; margin: .8rem 0; }
  input { font: 13px ui-monospace, monospace; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 8px; }
  button { grid-column: 2; justify-self: start; font: 600 13px Inter, system-ui, sans-serif; color: #fff; background: var(--purple); border: 0; border-radius: 99px; padding: .45rem 1.2rem; cursor: pointer; }
</style>
</head>
<body>
<div class="hero"><div>
  <h1>Monad Foundation announcements<span id="network" class="tag" hidden></span></h1>
  <p>Each announcement below was signed by two Monad Foundation keys, checked on-chain.</p>
</div></div>
<main>

<div id="warning" class="warning" hidden></div>
<div id="status" class="muted">Loading…</div>
<section id="list"></section>

<footer class="muted">
  <details>
    <summary>Settings</summary>
    <p>Data is read from the RPC below. Anyone can run this page against their own node, to rely on nothing else.
      Leave a field empty for the default.</p>
    <form id="config">
      <label for="rpc">RPC</label><input id="rpc">
      <label for="registry">Registry</label><input id="registry" pattern="0x[0-9a-fA-F]{40}">
      <button>Load</button>
    </form>
    <div id="keys"></div>
  </details>
</footer>
</main>

<script>
// The registry this page reads by default, and the network it is on (empty for mainnet).
const DEFAULT_REGISTRY = "0x8F759C1c40322f49881053c95b1DE5C2035863D1";
const DEFAULT_RPC = "https://testnet-rpc.monad.xyz";
const NETWORK = "Testnet";

// Function selectors of AnnouncementRegistry.
const SEL = { count: "0x06661abd", latest: "0x52bfe789", keySet: "0x788499c0", announcement: "0x91b5aa36" };

const $ = (id) => document.getElementById(id);
$("network").textContent = NETWORK;
$("network").hidden = !NETWORK;
// Settings are only changed by hand, never by a link: a crafted RPC or registry
// could show anything.
$("rpc").placeholder = DEFAULT_RPC;
$("registry").placeholder = DEFAULT_REGISTRY || "0x…";
$("rpc").value = localStorage.getItem("rpc") || "";
$("registry").value = localStorage.getItem("registry") || "";

async function call(rpc, to, data) {
  const res = await fetch(rpc, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to, data }, "latest"] }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.result.slice(2);
}

// Minimal ABI decoding over a hex string without 0x.
const word = (hex, i) => hex.slice(i * 64, i * 64 + 64);
const uint = (hex, i) => BigInt("0x" + word(hex, i));
function bytes20Array(hex, offset) {
  const start = offset / 32, n = Number(uint(hex, start));
  return Array.from({ length: n }, (_, k) => word(hex, start + 1 + k).slice(0, 40).toUpperCase());
}
function string(hex, offset) {
  const start = offset / 32, len = Number(uint(hex, start));
  const bytes = hex.slice((start + 1) * 64, (start + 1) * 64 + len * 2).match(/../g) || [];
  return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes.map((b) => parseInt(b, 16))));
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// The Slack-style codes the announcements use.
const EMOJI = {
  large_green_circle: "🟢", large_orange_circle: "🟠", large_red_circle: "🔴", large_yellow_circle: "🟡",
  large_blue_circle: "🔵", white_check_mark: "✅", warning: "⚠️", rotating_light: "🚨",
};

// Renders `code`, **bold**, links and :emoji: as DOM nodes. Everything else stays
// text, so nothing in an announcement can become markup or script.
function render(text) {
  const fragment = document.createDocumentFragment();
  const token = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(https?:\/\/[^\s<>"']*[^\s<>"'.,;:!?)\]])|:([a-z0-9_]+):/g;
  let last = 0;
  for (const m of text.matchAll(token)) {
    fragment.append(text.slice(last, m.index));
    if (m[1]) fragment.append(el("code", { textContent: m[1].slice(1, -1) }));
    else if (m[2]) fragment.append(el("strong", { textContent: m[2].slice(2, -2) }));
    else if (m[3]) fragment.append(el("a", { href: m[3], textContent: m[3], target: "_blank", rel: "noopener noreferrer" }));
    else fragment.append(EMOJI[m[4]] ?? m[0]);
    last = m.index + m[0].length;
  }
  fragment.append(text.slice(last));
  return fragment;
}

async function load() {
  const rpc = $("rpc").value.trim() || DEFAULT_RPC;
  const registry = $("registry").value.trim() || DEFAULT_REGISTRY;
  const custom = [rpc !== DEFAULT_RPC && "RPC", registry.toLowerCase() !== DEFAULT_REGISTRY.toLowerCase() && "registry"].filter(Boolean);
  $("warning").hidden = custom.length === 0;
  $("warning").textContent = `You are using a custom ${custom.join(" and ")} (see Settings). Only trust it if you set it up yourself.`;
  $("list").replaceChildren();
  $("keys").replaceChildren();
  $("status").className = "muted";
  if (!/^0x[0-9a-fA-F]{40}$/.test(registry)) {
    $("status").textContent = "No registry address set. Open Settings below.";
    return;
  }
  $("status").textContent = "Loading…";
  try {
    const keys = bytes20Array(await call(rpc, registry, SEL.keySet), 32);
    $("keys").append(
      el("p", { textContent: `Pinned keys (any two must sign). They must match https://docs.monad.xyz/node-ops/gpg-keys.json.` }),
      ...keys.map((k) => el("div", { className: "fpr", textContent: k })),
    );

    const count = uint(await call(rpc, registry, SEL.count), 0);
    if (count === 0n) {
      $("status").textContent = "No announcements yet.";
      return;
    }
    const latest = uint(await call(rpc, registry, SEL.latest), 0);
    let found = 0n;
    for (let n = latest; n >= 0n && found < count; n--) {
      const hex = await call(rpc, registry, SEL.announcement + n.toString(16).padStart(64, "0")).catch(() => null);
      if (!hex) continue;
      found++;
      const lines = string(hex, Number(uint(hex, 0))).split("\n");
      const signers = bytes20Array(hex, Number(uint(hex, 1)));
      $("list").append(el("article", {}, [
        el("header", {}, [
          el("h2", {}, [render(lines[0])]),
          el("span", { className: "badge", textContent: `✓ Signed by ${signers.length} of ${keys.length} keys` }),
        ]),
        el("div", { className: "body" }, [render(lines.slice(1).join("\n").trim())]),
        el("details", {}, [
          el("summary", { textContent: "Signers" }),
          ...signers.map((s) => el("div", { className: "fpr", textContent: s })),
        ]),
      ]));
    }
    $("status").textContent = "";
  } catch (e) {
    $("status").className = "error";
    $("status").textContent = `Could not read the registry: ${e.message}`;
  }
}

$("config").addEventListener("submit", (e) => {
  e.preventDefault();
  for (const id of ["rpc", "registry"]) {
    const value = $(id).value.trim();
    value ? localStorage.setItem(id, value) : localStorage.removeItem(id);
  }
  load();
});
load();
</script>
</body>
</html>
